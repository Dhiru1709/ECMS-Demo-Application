<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECMS | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container-fluid login-page">

    <div class="row vh-100">

        <!-- Left Side -->

        <div class="col-lg-7 d-none d-lg-flex left-panel">

            <div>

                <h1>
                    Enterprise Customer Management System
                </h1>

                <p>
                    Modern QA Demo Application built for showcasing Manual Testing,
                    API Testing, SQL Validation and Selenium Automation Framework.
                </p>

            </div>

        </div>

        <!-- Right Side -->

        <div class="col-lg-5 d-flex justify-content-center align-items-center">

            <div class="login-card">

                <div class="text-center mb-4">

                    <div class="logo">

                        ECMS

                    </div>

                    <h3 class="mt-3">
                        Welcome Back
                    </h3>

                    <p class="text-muted">
                        Sign in to continue
                    </p>

                </div>

                <form>

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="fa-solid fa-user"></i>

                            </span>

                            <input
                                    id="username"
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter Username">

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="fa-solid fa-lock"></i>

                            </span>

                            <input
                                    id="password"
                                    type="password"
                                    class="form-control"
                                    placeholder="Enter Password">

                        </div>

                    </div>

                    <div class="d-flex justify-content-between mb-4">

                        <div class="form-check">

                            <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember">

                            <label
                                    class="form-check-label"
                                    for="remember">

                                Remember Me

                            </label>

                        </div>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>

                    <button
                            id="loginBtn"
                            class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

                <div class="text-center mt-4">

                    <small>

                        © 2026 ECMS Demo Application

                    </small>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="assets/js/script.js"></script>

</body>

</html>
