<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECMS | Create Invoice</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/invoice-details.css">
</head>
<body>

<!-- PATCHES TO APPLY TO YOUR CURRENT FILE -->

<!-- 1. General Tab -->
<!-- Replace Customer input with -->
<select class="form-select">
  <option selected>Select Customer</option>
  <option>ABC Energy Ltd</option>
  <option>Delta Utilities</option>
  <option>Omega Gas</option>
</select>

<!-- Replace Currency input with -->
<select class="form-select">
  <option>GBP</option>
  <option>USD</option>
  <option>EUR</option>
</select>

<!-- Replace Payment Terms input with -->
<select class="form-select">
  <option>Net 15</option>
  <option>Net 30</option>
  <option>Net 45</option>
</select>

<!-- Replace Accounting Period -->
<select class="form-select">
  <option>July 2026</option>
  <option>August 2026</option>
</select>

<!-- Purchase Order -->
<input type="text" class="form-control" placeholder="Enter Purchase Order">

<!-- Contract Number -->
<input type="text" class="form-control" placeholder="Enter Contract Number">

<!-- Price Agreement -->
<select class="form-select">
  <option>Select Price Agreement</option>
  <option>Fixed Commodity Agreement</option>
  <option>Index Based Agreement</option>
</select>

<!-- Invoice Date -->
<input type="date" class="form-control">

<!-- Due Date -->
<input type="date" class="form-control">

<!-- 2. Line Items -->
<!-- Table Header -->
<table class="table table-hover">
<thead>
<tr>
<th>Commodity</th>
<th>Description</th>
<th>Quantity</th>
<th>UOM</th>
<th>Rate</th>
<th>Tax</th>
<th>Amount</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr>
<td>
<select class="form-select">
<option>Natural Gas</option>
<option>Transportation</option>
<option>Storage</option>
</select>
</td>
<td><input class="form-control" placeholder="Description"></td>
<td><input type="number" class="form-control"></td>
<td>
<select class="form-select">
<option>MMBTU</option>
<option>EA</option>
</select>
</td>
<td><input type="number" class="form-control"></td>
<td>
<select class="form-select">
<option>0%</option>
<option>5%</option>
<option>10%</option>
<option>18%</option>
</select>
</td>
<td><input class="form-control" value="£0.00" readonly></td>
<td><button class="btn btn-outline-danger btn-sm">Delete</button></td>
</tr>
</tbody>
</table>

<!-- 3. Payments -->
<div class="alert alert-info">
No payments available.<br>
Payments can be recorded after invoice creation.
</div>

<!-- 4. Documents -->
<div class="alert alert-warning">
Documents can be uploaded after invoice creation.
</div>

<!-- 5. Audit -->
<div class="alert alert-secondary">
Audit history will be generated after invoice creation.
</div>

<!-- 6. Quick Actions -->
<div class="d-grid gap-2">
<button class="btn btn-outline-primary">Save Draft</button>
<button class="btn btn-success">Create Invoice</button>
</div>

<!-- 7. Related Records -->
<div class="alert alert-secondary">
Related records will appear after invoice creation.
</div>

</body>
</html>
